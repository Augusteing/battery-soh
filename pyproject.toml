[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-soh"
version = "0.1.0"
description = "复杂动态工况下混合动力车辆磷酸铁锂电池 SOC/SOH 高精度估计研究"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
